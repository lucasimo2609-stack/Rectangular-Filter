<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Rectangular Filter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="../icons/icon-48.png" alt="" width="32" height="32" />
    <h1>Rectangular Filter</h1>
  </header>
  <label class="switch">
    <input type="checkbox" id="enabled" checked />
    <span>Filtro attivo in Google Meet e Teams</span>
  </label>
  <p>Apri una videochiamata e accendi la webcam: compare il pannello con i filtri. Se la chiamata era già aperta, ricarica la pagina.</p>
  <button id="setup">Prepara lo sfondo</button>
  <button id="open" class="ghost">Apri l'app a tutto schermo</button>
  <script src="popup.js"></script>
</body>
</html>
